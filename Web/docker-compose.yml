services:
  backend:
    build: ./backend
    container_name: backend-app
    ports:
      - "8080:8080"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-mi_clave_super_segura_de_mas_de_32_caracteres}
      FRONTEND_OAUTH2_SUCCESS_URL: ${FRONTEND_OAUTH2_SUCCESS_URL:-http://localhost:3000/oauth2/success}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      - postgres
    restart: always

  frontend:
    build: ./Front-End
    container_name: frontend-app
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  postgres:
    image: postgres:15
    container_name: eduaircontrol-db
    environment:
      POSTGRES_DB: eduaircontrol
      POSTGRES_USER: eduair_user
      POSTGRES_PASSWORD: eduair_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
  jenkins:
    build:
      context: ../jenkins
      dockerfile: dockerfile
    container_name: jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

volumes:
  postgres_data:
  jenkins_data:
